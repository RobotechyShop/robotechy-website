name: Trigger production deploy

# Production robotechy runs as a Docker container in the `apps-stack` on the
# self-hosted `black-panther` box (it builds from this repo and runs the
# order-service backend, which a static host can't). On a `v*` tag this fires a
# repository_dispatch to the private BenGWeeks/black-panther repo, whose
# self-hosted runner rebuilds & restarts the container.
#
# Required secret:
#   BLACK_PANTHER_DEPLOY_TOKEN — a token with access to BenGWeeks/black-panther
#   able to POST repository dispatches (classic PAT with `repo` scope, or a
#   fine-grained PAT scoped to that repo with Contents: read & write).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag/branch/sha to deploy (defaults to the run ref, usually main)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch deploy to black-panther
    runs-on: ubuntu-latest
    steps:
      - name: Fire deploy-robotechy
        env:
          TOKEN: ${{ secrets.BLACK_PANTHER_DEPLOY_TOKEN }}
          # On a manual run, honour the operator's `ref` input; otherwise use
          # the ref that triggered the run (the pushed `v*` tag).
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::BLACK_PANTHER_DEPLOY_TOKEN is not set — cannot trigger the deploy."
            exit 1
          fi
          # Build the dispatch payload with jq so REF is JSON-escaped, not
          # string-interpolated into the body (avoids breaking/injecting JSON).
          PAYLOAD=$(jq -nc --arg ref "$REF" \
            '{event_type:"deploy-robotechy",client_payload:{ref:$ref}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BenGWeeks/black-panther/dispatches \
            -d "$PAYLOAD"
          echo "Dispatched deploy-robotechy for ${REF}."
